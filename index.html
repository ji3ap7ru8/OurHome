<!DOCTYPE html>
<html lang="zh-TW" style="font-size: 100%;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我們の家 - 專業牛牛服務站</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        if (window.tailwind) tailwind.config = { darkMode: 'class' };
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- 大廳標題「我們の家」專用字體（只載入這 4 個字，很小） -->
    <link href="https://fonts.googleapis.com/css2?family=Huninn&text=%E6%88%91%E5%80%91%E3%81%AE%E5%AE%B6&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/app.css">
    <!-- 網頁Logo圖示 -->
    <link rel="icon" type="image/png" href="OurHome.png">
    <link rel="apple-touch-icon" href="OurHome.png">
    <!-- 啟動載入畫面（內嵌樣式，不等其他檔案；bootstrap 完成後由 core/loading.js 移除） -->
    <style>
        #appSplash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#f8fafc;color:#475569;font-family:'Noto Sans TC',sans-serif;font-weight:700;font-size:15px;transition:opacity .25s ease}
        #appSplash img{width:72px;height:72px;border-radius:18px}
        #appSplash.hide{opacity:0;pointer-events:none}
        @media (prefers-color-scheme:dark){#appSplash{background:#0f172a;color:#cbd5e1}}
        .oh-spinner{width:30px;height:30px;border-radius:50%;border:4px solid rgba(148,163,184,.35);border-top-color:#0284c7;animation:oh-spin .8s linear infinite}
        @keyframes oh-spin{to{transform:rotate(360deg)}}
        @media (prefers-reduced-motion:reduce){.oh-spinner{animation-duration:2s}}
    </style>
</head>
<body class="flex items-center justify-center select-none overflow-hidden bg-slate-100">
    <div id="appSplash" role="status" aria-live="polite">
        <img src="OurHome.png" alt="">
        <div class="oh-spinner"></div>
        <div>載入中...</div>
    </div>
    <script>setTimeout(function(){var e=document.getElementById('appSplash');if(e)e.remove();},15000);</script>


    <!-- Mobile Viewport Container (App Shell) -->
    <div id="appContainer" class="relative w-full max-w-md bg-slate-50 dark:bg-slate-900 transition-colors duration-300 overflow-hidden flex flex-col justify-between shadow-md">

        <!-- 大廳主畫面 -->
        <div class="flex-1 overflow-y-auto no-scrollbar relative flex flex-col pb-20 bg-slate-50 dark:bg-slate-900 transition-colors duration-300">

        <!-- Soft Pastel Background Shapes -->
        <!-- 背景固定不跟著捲動：外層 sticky（高度 0）貼在畫面頂端，內層鋪滿一個畫面高度，介面在上面滑動 -->
        <div id="bgShapes" class="sticky top-0 h-0 pointer-events-none z-0 transition-opacity duration-300 dark:opacity-10">
          <div class="absolute top-0 left-0 w-full overflow-hidden" style="height:100vh;height:100dvh">
            <div class="absolute -top-10 -left-10 w-44 h-44 bg-amber-100/90 blob-1"></div>
            <div class="absolute top-2 -right-8 w-40 h-40 bg-purple-200/70 blob-2"></div>
            <div class="absolute -top-12 right-12 w-32 h-32 bg-sky-200/80 rounded-full"></div>
            <div class="absolute top-16 left-28 w-36 h-28 bg-rose-200/70 blob-1"></div>

            <div class="absolute top-1/3 -left-12 w-48 h-48 bg-emerald-100/70 blob-2"></div>
            <div class="absolute top-1/2 -right-12 w-52 h-52 bg-amber-100/75 blob-1"></div>
            <div class="absolute top-[42%] left-10 w-36 h-36 bg-indigo-100/60 rounded-full"></div>

            <div class="absolute bottom-28 -left-8 w-44 h-44 bg-rose-100/75 blob-3"></div>
            <div class="absolute bottom-16 right-4 w-40 h-40 bg-sky-100/80 blob-2"></div>
            <div class="absolute -bottom-8 left-1/3 w-48 h-36 bg-purple-100/70 rounded-full"></div>
          </div>
        </div>

        <!-- 「生活圖卡」頁專用背景：扁平粗圈圓形 / 圓角菱形（顏色跟著主題色，見 app.css） -->
        <div id="bgCards" class="bg-cards-layer pointer-events-none z-0" aria-hidden="true">
            <svg viewBox="0 0 390 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
                <circle class="bgc c2" cx="30" cy="30" r="125"/>
                <circle class="bgc c3" cx="365" cy="95" r="78"/>
                <rect class="bgc c1" x="-100" y="-100" width="200" height="200" rx="46" transform="translate(-30 360) rotate(45)"/>
                <circle class="bgc c4" cx="410" cy="410" r="125"/>
                <circle class="bgc c5" cx="45" cy="650" r="95"/>
                <circle class="bgc c3" cx="330" cy="735" r="85"/>
                <circle class="bgc c2" cx="200" cy="790" r="42"/>
            </svg>
        </div>

        <!-- 「菜單」頁專用背景：米色餐桌紙 + 格紋桌巾 + 餐具／檸檬／咖啡杯線稿（只在該頁顯示，見 app.css） -->
        <div id="bgMenu" class="bg-menu-layer pointer-events-none z-0" aria-hidden="true">
            <svg viewBox="0 0 390 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <g id="bm-fork"><path d="M-9 -30V-14Q-9 -6 0 -6Q9 -6 9 -14V-30M0 -30V-6M0 -6V34"/></g>
                    <g id="bm-knife"><path d="M-4 -32Q9 -26 9 -4V6H-4ZM2 6V36"/></g>
                    <g id="bm-spoon"><ellipse cx="0" cy="-20" rx="9" ry="13"/><path d="M0 -7V34"/></g>
                    <g id="bm-lemon"><circle r="22"/><circle r="16"/><path d="M0 -16V16M-16 0H16M-11 -11L11 11M11 -11L-11 11"/></g>
                    <g id="bm-cup"><path d="M-18 -10H14V8A14 14 0 0 1 0 22H-4A14 14 0 0 1 -18 8ZM14 -4H20A7 7 0 0 1 20 10H14M-9 -20Q-5 -26 -9 -32M1 -20Q5 -26 1 -32"/></g>
                    <g id="bm-leaf"><path d="M0 0Q20 -22 42 0Q20 22 0 0ZM0 0H42M12 0L22 -9M12 0L22 9"/></g>
                </defs>
                <g class="bgm">
                    <circle cx="348" cy="78" r="64"/><circle cx="348" cy="78" r="46"/>
                    <use href="#bm-fork" transform="translate(262 92) rotate(-14)"/>
                    <use href="#bm-knife" transform="translate(436 76) rotate(14)"/>
                    <circle cx="30" cy="650" r="70"/><circle cx="30" cy="650" r="50"/>
                    <use href="#bm-spoon" transform="translate(120 690) rotate(24)"/>
                    <use href="#bm-lemon" transform="translate(48 250) rotate(12)"/>
                    <use href="#bm-cup" transform="translate(338 400) rotate(-10)"/>
                    <use href="#bm-leaf" transform="translate(250 560) rotate(-30)"/>
                    <use href="#bm-leaf" transform="translate(300 745) rotate(18) scale(.8)"/>
                    <use href="#bm-fork" transform="translate(196 760) rotate(34) scale(.8)"/>
                </g>
            </svg>
        </div>

        <!-- 「翻譯機」頁專用背景：對話泡泡 + 文字符號 + 點陣（顏色全由主題色推算，見 app.css） -->
        <div id="bgTranslator" class="bg-translator-layer pointer-events-none z-0" aria-hidden="true">
            <svg viewBox="0 0 390 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
                <g class="bgt">
                    <rect x="212" y="62" width="200" height="118" rx="40"/><path d="M262 176 L246 222 L304 178 Z"/>
                    <rect x="-52" y="318" width="186" height="108" rx="38"/><path d="M86 422 L112 462 L128 424 Z"/>
                    <rect x="236" y="560" width="210" height="122" rx="42"/><path d="M300 678 L276 724 L338 680 Z"/>
                    <circle cx="48" cy="700" r="64"/>
                    <circle cx="190" cy="262" r="16"/><circle cx="352" cy="400" r="26"/><circle cx="150" cy="520" r="12"/>
                </g>
                <g class="bgt-t" font-weight="900" text-anchor="middle">
                    <text x="312" y="148" font-size="84">A</text>
                    <text x="42" y="396" font-size="78">文</text>
                    <text x="341" y="650" font-size="72">Hi</text>
                    <text x="48" y="726" font-size="46">你好</text>
                </g>
            </svg>
        </div>

        <!-- 「碼表」頁專用背景：錶盤刻度圓環 + 指針 + 弧線（顏色全由主題色推算，見 app.css） -->
        <div id="bgStopwatch" class="bg-stopwatch-layer pointer-events-none z-0" aria-hidden="true">
            <svg viewBox="0 0 390 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
                <g class="bgw">
                    <!-- 右上：大錶盤（60 小刻度 + 12 大刻度 + 指針） -->
                    <circle class="bgw-f" cx="338" cy="96" r="128"/>
                    <circle class="bgw-s" cx="338" cy="96" r="128"/>
                    <circle class="bgw-t" cx="338" cy="96" r="112" stroke-width="14" stroke-dasharray="2.4 9.33"/>
                    <circle class="bgw-t big" cx="338" cy="96" r="112" stroke-width="24" stroke-dasharray="3.6 55.04" transform="rotate(-90 338 96)"/>
                    <path class="bgw-a" d="M338 96 L338 20"/>
                    <path class="bgw-a" d="M338 96 L384 130" stroke-width="7"/>
                    <circle class="bgw-d" cx="338" cy="96" r="9"/>
                    <!-- 左中：小錶盤 -->
                    <circle class="bgw-f" cx="26" cy="420" r="84"/>
                    <circle class="bgw-s" cx="26" cy="420" r="84"/>
                    <circle class="bgw-t" cx="26" cy="420" r="70" stroke-width="12" stroke-dasharray="2.2 5.13"/>
                    <path class="bgw-a" d="M26 420 L74 392"/>
                    <circle class="bgw-d" cx="26" cy="420" r="7"/>
                    <!-- 左下：進度弧線圓環 -->
                    <circle class="bgw-s" cx="64" cy="706" r="92" stroke-width="16"/>
                    <circle class="bgw-a" cx="64" cy="706" r="92" stroke-width="16" fill="none" stroke-dasharray="330 600" transform="rotate(-70 64 706)"/>
                    <!-- 右下：小圓點與圓環 -->
                    <circle class="bgw-f" cx="340" cy="640" r="52"/>
                    <circle class="bgw-s" cx="340" cy="640" r="52"/>
                    <circle class="bgw-d" cx="212" cy="772" r="14"/>
                    <circle class="bgw-d" cx="364" cy="372" r="10"/>
                    <circle class="bgw-d" cx="150" cy="300" r="7"/>
                </g>
            </svg>
        </div>

        <!-- 「計時器」頁專用背景：沙漏 + 倒數進度圓環 + 點點（顏色全由主題色推算，見 app.css） -->
        <div id="bgTimer" class="bg-timer-layer pointer-events-none z-0" aria-hidden="true">
            <svg viewBox="0 0 390 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <g id="bgh-glass"><path d="M-34 -52 H34 M-34 52 H34 M-28 -52 C-28 -14 -4 -8 -4 0 C-4 8 -28 14 -28 52 M28 -52 C28 -14 4 -8 4 0 C4 8 28 14 28 52"/><path class="bgh-sand" d="M-16 -40 H16 C14 -22 4 -12 0 -4 C-4 -12 -14 -22 -16 -40 Z"/><path class="bgh-sand" d="M-22 46 H22 C18 30 8 24 0 24 C-8 24 -18 30 -22 46 Z"/></g>
                </defs>
                <!-- 右上：倒數圓環（進度弧 + 刻度點） -->
                <circle class="bgh-r" cx="340" cy="92" r="112"/>
                <circle class="bgh-a" cx="340" cy="92" r="112" stroke-dasharray="470 800" transform="rotate(-90 340 92)"/>
                <circle class="bgh-r thin" cx="340" cy="92" r="84"/>
                <!-- 左中：大沙漏 -->
                <g class="bgh" transform="translate(40 392) rotate(-14) scale(1.9)"><use href="#bgh-glass"/></g>
                <!-- 右下：沙漏與圓環 -->
                <g class="bgh" transform="translate(318 604) rotate(16) scale(1.3)"><use href="#bgh-glass"/></g>
                <circle class="bgh-r" cx="56" cy="716" r="86"/>
                <circle class="bgh-a" cx="56" cy="716" r="86" stroke-dasharray="190 800" transform="rotate(-20 56 716)"/>
                <!-- 點點 -->
                <circle class="bgh-d" cx="214" cy="40" r="9"/><circle class="bgh-d" cx="372" cy="330" r="12"/>
                <circle class="bgh-d" cx="170" cy="784" r="14"/><circle class="bgh-d" cx="150" cy="500" r="7"/>
            </svg>
        </div>

        <!-- 「應用程式」頁專用背景：點陣 + 主題色光暈 + 圓環（只在該頁顯示，見 app.css） -->
        <div id="bgApps" class="bg-apps-layer overflow-hidden pointer-events-none z-0"></div>

            <!-- 頂部列 (components/header.js) -->
            <div id="headerMount"></div>

            <!-- 服務模組掛載點：Stage 2~4 的 /services/* 會渲染到這裡 -->
            <div id="viewOutlet" class="relative z-10 flex-1"></div>
        </div>

        <!-- 底欄 Dock (components/dock.js) -->
        <div class="dock-wrap absolute left-0 right-0 px-5 z-30 pointer-events-none">
            <div id="dockContainer" class="pointer-events-auto bg-white/95 dark:bg-slate-800/95 backdrop-blur-md rounded-full px-5 py-2 flex justify-between items-center soft-shadow-md border border-slate-100 dark:border-slate-700"></div>
        </div>

        <!-- 共用遮罩 -->
        <div id="backdrop" data-action="close-all" class="backdrop pointer-events-none opacity-0 fixed inset-0 bg-slate-900/40 backdrop-blur-[2px] z-40"></div>

        <!-- 共用 Bottom Sheet (components/bottom-sheet.js) -->
        <div id="bottomSheetMount"></div>

        <!-- 右側設定視窗 (components/settings-panel.js) -->
        <div id="settingsMount"></div>

        <!-- 應用程式頁的右側選項視窗 (components/apps-options.js) -->
        <div id="appsOptionsMount"></div>
    </div>

    <script type="module" src="./main.js"></script>
    <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(function(){});</script>
</body>
</html>
